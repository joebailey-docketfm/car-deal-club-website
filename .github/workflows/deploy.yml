# Deploys the site to Cloudflare Pages (project car-deal-club in Jim's account).
# Runs only when started by hand (Actions > Deploy to Cloudflare > Run workflow),
# so nothing goes live until Joe says GO.
name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        description: "preview or production"
        required: true
        default: preview
        type: choice
        options: [preview, production]

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8ef56b1c65924a22d67ef81ae647d685
          WRANGLER_SEND_METRICS: "false"
        run: |
          branch=preview
          if [ "${{ inputs.target }}" = "production" ]; then branch=main; fi
          npx wrangler pages deploy --project-name car-deal-club --branch "$branch" \
            --commit-hash "$GITHUB_SHA" --commit-message "Deploy from GitHub Actions ($GITHUB_REF_NAME)"
